services:
  - type: web
    name: northstar-ai-sales-agent
    runtime: python
    plan: free
    pythonVersion: "3.13.7"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
